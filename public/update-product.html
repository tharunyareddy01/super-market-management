<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Update Product | Tharunya Supermarket</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="sidebar"><div class="logo">THARUNYA<span>SUPERMARKET</span></div><nav class="nav"><a href="index.html"><i>●</i> Home</a><a href="add-product.html"><i>●</i> Add Product</a><a href="update-product.html" class="active" aria-current="page"><i>●</i> Update Product</a><a href="delete-product.html"><i>●</i> Delete Product</a><a href="list-products.html"><i>●</i> List All</a><a href="search-product.html"><i>●</i> Search by ID</a></nav></aside><main class="main"><div class="page-header"><p class="kicker">INVENTORY / MODIFY</p><h1>Update <span>Product</span></h1><p class="subtitle">Choose a product from the dropdown. Its current details will load automatically.</p></div>
<section class="panel"><form id="updateForm"><div class="form-grid">
<div class="field full"><label for="updateProductId">Select Product</label><select id="updateProductId" data-product-select required></select></div>
<div id="update-fields" hidden class="field full"><div class="form-grid">
<div class="field"><label for="name">Product Name</label><input id="name" name="name" type="text" required></div>
<div class="field"><label for="price">Price (₹)</label><input id="price" name="price" type="number" min="0" step="0.01" required></div>
<div class="field"><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="0" required></div>
<div class="field"><label for="category">Category</label><select id="category" name="category" required><option>Groceries</option><option>Beverages</option><option>Snacks</option><option>Bakery</option><option>Dairy</option><option>Household</option><option>Personal Care</option></select></div>
</div></div></div>
<div class="actions"><button class="btn" type="submit">✦ Update Product</button><button class="btn secondary" type="reset">Reset</button></div><div id="message" hidden></div></form></section><footer>THARUNYA SUPERMARKET • INVENTORY MANAGEMENT SYSTEM</footer></main><script src="app.js"></script></body></html>
